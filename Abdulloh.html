<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O'Hara AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#08090d;
    color:white;
}
nav{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8%;
    border-bottom:1px solid #222;
}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#7c5cff}
nav button{
    background:#7c5cff;
    color:white;
    border:0;
    padding:11px 20px;
    border-radius:25px;
}
.hero{
    min-height:calc(100vh - 70px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}
h1{
    font-size:clamp(45px,8vw,85px);
    background:linear-gradient(90deg,#fff,#8d73ff);
    -webkit-background-clip:text;
    color:transparent;
}
p{
    color:#aaa;
    font-size:18px;
    max-width:600px;
    margin:20px 0;
    line-height:1.6;
}
.card{
    width:min(700px,95%);
    background:#11131b;
    border:1px solid #292c3a;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 50px #301c7040;
}
input{
    width:75%;
    padding:15px;
    background:#08090d;
    border:1px solid #333;
    border-radius:12px;
    color:white;
    outline:none;
}
.ask{
    padding:15px 20px;
    margin-left:8px;
    border:0;
    border-radius:12px;
    background:#7c5cff;
    color:white;
    cursor:pointer;
}
#answer{
    margin-top:20px;
    color:#bbb;
}
</style>
</head>

<body>

<nav>
    <div class="logo">O'Hara<span> AI</span></div>
    <button>Start</button>
</nav>

<section class="hero">
    <h1>Think smarter.</h1>

    <p>
        Zamonaviy sun'iy intellekt interfeysi.
        Savolingizni yozing va O'Hara AI javob beradi.
    </p>

    <div class="card">
        <input id="question" placeholder="Savolingizni yozing...">
        <button class="ask" onclick="ask()">Yuborish</button>
        <div id="answer"></div>
    </div>
</section>

<script>
function ask(){
    let q=document.getElementById("question").value;
    let a=document.getElementById("answer");

    if(!q){
        a.innerText="Avval savol yozing 🙂";
        return;
    }

    a.innerText="O'Hara AI: Savolingiz qabul qilindi. 🚀";
}
</script>

</body>
</html>
